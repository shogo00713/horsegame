<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 48">
  <!-- 全力で駆ける馬のシルエット。形だけが使われ、色は CSS(Icon.module.css)側で決まる。
       このファイルを好きな馬のSVGに差し替えると、画面のアイコンがそのまま変わる -->
  <g fill="#000" stroke="#000" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="none">
      <!-- 胴 -->
      <path d="M11 21C11 17.5 15 16 20 16.5C26 17.5 31 17 36 15.5C41 15 45 17.5 46.5 21.5C47 26 43 28.5 38 28.5C33 28 29 26 25 26.5C19 27.5 11 25 11 21Z"/>
      <!-- 首と頭(耳は2つ) -->
      <path d="M36 16C41 12 46 9.5 51 9.5L51.5 5.2L53.6 8.6L55.2 6L56 10.2C58.5 11.5 61 14.5 63 18.5C63.5 20.5 61.5 22 59.5 21C57 20 54.5 18.5 52 18C50 21.5 47.5 24.5 44 26.5L38 22Z"/>
      <!-- たてがみ -->
      <path d="M51 9.5C46 6.5 40 7 34.5 11.5C40 9.5 44 10 49 12Z"/>
      <!-- しっぽ(後ろ脚と重ならないように、上へ流す) -->
      <path d="M12 18.5C7 14.5 3 14.5 0 17.5C4 17.5 7 19 11.5 22Z"/>
      <path d="M11.5 20.5C7 20 3 22 0.5 25.5C4.5 23.5 8 24 11.5 24.5Z"/>
    </g>
    <g fill="none">
      <!-- 前脚(奥)。太い線が付け根、細い線が先 -->
      <path stroke-width="4.2" d="M40 27L48.5 31"/>
      <path stroke-width="2.4" d="M48.5 31L54.5 36.5"/>
      <!-- 前脚(手前) -->
      <path stroke-width="4.6" d="M43 26.5L52 27.5"/>
      <path stroke-width="2.6" d="M52 27.5L60 31.5"/>
      <!-- 後ろ脚(奥) -->
      <path stroke-width="4.6" d="M17 27L12 35"/>
      <path stroke-width="2.6" d="M12 35L6 40.5"/>
      <!-- 後ろ脚(手前) -->
      <path stroke-width="5" d="M14.5 26L8 31.5"/>
      <path stroke-width="2.8" d="M8 31.5L2 35"/>
    </g>
  </g>
</svg>
